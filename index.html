<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- HUB -->
<title>Fireside Tales</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap">
<style>
/* One screen: the 480x270 pixel campfire, scaled whole-number where it can,
   with the story links as HTML buttons laid over their stumps. Night-only look. */
:root {
  --night0: #0b0d14;
  --night2: #232a40;
  --ember: #c88a45;
  --flame: #f2c27a;
  --paper: #d9cfb4;
  --paper-dim: #a89c80;
  --font-display: "Silkscreen", "Courier New", monospace;
  --font-body: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night0);
  color: var(--paper);
  font-family: var(--font-body);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
#wrap { height: 100%; display: grid; place-items: center; }
#stage { position: relative; }
#scene {
  display: block; width: 100%; height: 100%;
  image-rendering: pixelated; image-rendering: crisp-edges;
}
#title {
  position: absolute; left: 0; right: 0; top: 4.5%;
  text-align: center; pointer-events: none;
}
#title h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: max(calc(var(--u) * 15), 20px); letter-spacing: 0.08em;
  color: var(--flame); text-shadow: 0 calc(var(--u) * 1) 0 var(--night0), 0 0 calc(var(--u) * 6) rgba(200, 138, 69, 0.35);
}
#title p {
  margin: calc(var(--u) * 1) 0 0; font-size: max(calc(var(--u) * 9), 13px);
  color: var(--paper-dim); letter-spacing: 0.04em;
}
.tale {
  position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
  color: var(--paper); text-decoration: none; font: inherit;
  border-radius: calc(var(--u) * 3);
}
.tale .name {
  font-family: var(--font-display); font-size: max(calc(var(--u) * 6.4), 9px); line-height: 1.1;
  white-space: nowrap; color: var(--paper);
  text-shadow: 0 calc(var(--u) * 0.6) 0 var(--night0), 0 0 calc(var(--u) * 3) var(--night0);
}
.tale .soon {
  font-size: max(calc(var(--u) * 6.5), 11px); line-height: 1; color: var(--paper-dim);
  text-shadow: 0 0 calc(var(--u) * 2) var(--night0);
}
.tale:hover .name, .tale:focus-visible .name { color: var(--flame); }
.tale:focus-visible { outline: calc(var(--u) * 0.8) dashed var(--flame); outline-offset: calc(var(--u) * 1); }
#sound {
  position: absolute; right: calc(var(--u) * 6); top: calc(var(--u) * 6);
  font-family: var(--font-body); font-size: calc(var(--u) * 8);
  background: rgba(11, 13, 20, 0.6); color: var(--paper-dim);
  border: calc(var(--u) * 0.6) solid var(--night2); border-radius: calc(var(--u) * 2);
  padding: calc(var(--u) * 0.5) calc(var(--u) * 3); cursor: pointer;
}
#sound:hover, #sound:focus-visible { color: var(--flame); border-color: var(--ember); outline: none; }
#note {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -58%);
  width: calc(var(--u) * 190); max-width: 90%; box-sizing: border-box;
  background: var(--night0); border: calc(var(--u) * 1) solid var(--ember);
  box-shadow: 0 0 0 calc(var(--u) * 1) var(--night0), 0 0 calc(var(--u) * 20) rgba(200, 138, 69, 0.25);
  padding: calc(var(--u) * 9) calc(var(--u) * 10); text-align: center;
}
#note h2 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: calc(var(--u) * 10); color: var(--flame); text-wrap: balance;
}
#note p { margin: calc(var(--u) * 5) 0 calc(var(--u) * 7); font-size: calc(var(--u) * 9); line-height: 1.15; }
#note button {
  font-family: var(--font-display); font-size: calc(var(--u) * 6.5);
  background: var(--night2); color: var(--paper); cursor: pointer;
  border: calc(var(--u) * 0.6) solid var(--ember); padding: calc(var(--u) * 2) calc(var(--u) * 6);
}
#note button:hover, #note button:focus-visible { background: var(--ember); color: var(--night0); outline: none; }
#fade {
  position: absolute; inset: 0; background: var(--night0); opacity: 0;
  pointer-events: none; transition: opacity 0.7s ease-in;
}
#fade.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #fade { transition: none; } }
</style>
<!-- /HUB -->
</head>
<body>
<!-- HUBBODY -->
<div id="wrap">
  <div id="stage">
    <canvas id="scene" width="480" height="270" aria-label="A low campfire in a clearing in the woods at night, with five stories set on stumps around it"></canvas>
    <div id="title"><h1>Fireside Tales</h1><p>Pull up a stump. Pick a tale.</p></div>
    <div id="tales"></div>
    <button id="sound" type="button" aria-pressed="false">Sound off</button>
    <div id="note" role="dialog" aria-modal="true" aria-labelledby="note-title" hidden>
      <h2 id="note-title"></h2>
      <p>This tale isn't ready to be told yet. Come back another night.</p>
      <button id="note-close" type="button">Back to the fire</button>
    </div>
    <div id="fade"></div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var W = 480, H = 270;
  var C = {
    night0: '#0b0d14', night1: '#161a2a', night2: '#232a40', night3: '#39425e', steel: '#5b6684', fog: '#8d97b0',
    wood0: '#2a180d', wood1: '#3a2414', wood2: '#5e3a1f', wood3: '#8a5a2e', lamp3: '#c88a45', lamp4: '#f2c27a',
    paper: '#d9cfb4', paperShade: '#a89c80', paperDark: '#6e6552',
    brown0: '#2e1f17', brown1: '#4f3527', brown2: '#7a5640',
    crt0: '#0f2a1c', crt1: '#2f8f5a', crt2: '#7dffb0',
    red0: '#5c1a22', red1: '#a8323a', fut1: '#3fe0ff', flash: '#eef4ff'
  };

  // Where Emit Time lives: next to this page on GitHub Pages or from disk,
  // otherwise (inside a claude.ai artifact) the published site in a new tab.
  var local = location.protocol === 'file:' || /github\.io$/.test(location.hostname) || location.hostname === 'localhost';
  var EMIT_URL = local ? 'game/index.html' : 'https://vertith.github.io/Emit-Time/game/';

  var FX = 240, FY = 200; // fire base
  var TALES = [
    { id: 'emit', name: 'Emit Time', x: 92, y: 204, ready: true },
    { id: 'asylum', name: 'The Asylum', x: 148, y: 164 },
    { id: 'upstairs', name: 'Upstairs', x: 240, y: 150 },
    { id: 'walks', name: 'It Walks', x: 332, y: 164 },
    { id: 'lab', name: 'The Lab', x: 388, y: 204 }
  ];

  // ---------- helpers ----------
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  function bayer(x, y) { return (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16; }
  function rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
  function px(g, x, y, c) { g.fillStyle = c; g.fillRect(x, y, 1, 1); }
  function sprite(g, rows, map, x, y) {
    for (var j = 0; j < rows.length; j++) for (var i = 0; i < rows[j].length; i++) {
      var ch = rows[j][i]; if (ch !== '.' && map[ch]) px(g, x + i, y + j, map[ch]);
    }
  }
  function outline(g, rows, x, y, c) {
    g.fillStyle = c;
    for (var j = -1; j <= rows.length; j++) for (var i = -1; i <= rows[0].length; i++) {
      var on = rows[j] && rows[j][i] && rows[j][i] !== '.';
      if (on) continue;
      var n = [[0, 1], [0, -1], [1, 0], [-1, 0]].some(function (d) { var r = rows[j + d[1]]; return r && r[i + d[0]] && r[i + d[0]] !== '.'; });
      if (n) g.fillRect(x + i, y + j, 1, 1);
    }
  }

  // ---------- static scene, built once in layers ----------
  // sky > far ridge, fog and far pines > lit ground (three flicker levels) > mid pines and the camp > near pines
  var HORIZON = 124;
  var clamp01 = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
  function layer() { var cv = document.createElement('canvas'); cv.width = W; cv.height = H; return cv; }

  // A pine built from drooping tiers of needles. Light comes from the moon (upper right) and,
  // for trees near the clearing, warm firelight on the side facing the fire.
  // o: { cx, base, h, w, ramp: [shadow, base, lit, moon], warm: [dim, bright] | null, rim, seed, trunk: [dark, lit] }
  function pine(g, o) {
    var r = rng(o.seed || 1), top = o.base - o.h;
    var crownBot = o.base - Math.round(o.h * 0.14);
    var n = Math.max(4, Math.round(o.h / 13));
    var face = o.cx < FX ? 1 : -1; // which side looks at the fire
    // trunk with bark streaks
    var tw = Math.max(2, Math.round(o.w / 12));
    for (var ty = crownBot - 6; ty <= o.base; ty++) for (var tx = -Math.floor(tw / 2); tx < Math.ceil(tw / 2); tx++) {
      var lit = tx * face >= Math.floor(tw / 2) - 1;
      var c = (r() < 0.25) ? o.trunk[0] : lit ? o.trunk[1] : o.trunk[0];
      if (o.warm && lit) { var dd = Math.hypot(o.cx - FX, (ty - FY) * 1.6); if (dd < o.rim && bayer(o.cx + tx, ty) < 1 - dd / o.rim) c = o.warm[0]; }
      px(g, o.cx + tx, ty, c);
    }
    if (tw >= 3) { rect(g, o.cx - Math.floor(tw / 2) - 1, o.base, tw + 2, 1, o.trunk[0]); }
    // tiers, bottom first so each upper tier's fringe hangs over the one below
    for (var i = n - 1; i >= 0; i--) {
      var tTop = top + Math.round((crownBot - top) * (i / n) * 0.9);
      var tBot = top + Math.round((crownBot - top) * ((i + 1) / n)) + 2;
      var tHalf = (o.w / 2) * (0.18 + 0.82 * Math.pow((i + 1) / n, 0.9));
      var tr = rng((o.seed || 1) * 31 + i);
      for (var y = tTop; y <= tBot; y++) {
        var f = (y - tTop) / Math.max(1, tBot - tTop);
        var half = Math.round(tHalf * (0.1 + 0.9 * Math.pow(f, 0.8)));
        if (i === 0 && y === tTop) half = 0;
        var rowsLeft = tBot - y;
        for (var x = -half; x <= half; x++) {
          var ax = x + 64 + i * 2;
          if (rowsLeft === 0 && (ax % 3 !== 1)) continue;                              // hanging needle tips
          if (rowsLeft === 1 && Math.abs(x) > half * 0.7 && ax % 3 === 0) continue;
          var nx = half ? x / half : 0;
          var zone = f < 0.2 ? 0 : nx < -0.72 ? 0 : nx < 0.2 ? 1 : 2;
          if (zone === 1 && (ax - y + 400) % 4 === 0) zone = 0;                          // needle strokes
          else if (zone === 2 && (ax + y) % 4 === 0) zone = 1;
          if (tr() < 0.05) zone = Math.max(0, zone - 1);
          var col = o.ramp[zone];
          if (f > 0.55 && x >= half - 1 && x > 0) col = o.ramp[3];                      // moonlit edge
          if (o.warm) {
            var fs = nx * face, d = Math.hypot(o.cx + x - FX, (y - FY) * 1.6), k = clamp01(1 - d / o.rim);
            if (fs > 0.2 && f > 0.3) {
              var heat = k * (0.4 + fs) + (bayer(o.cx + x, y) - 0.5) * 0.12;
              if (heat > 0.85 && o.warm[1]) col = o.warm[1]; else if (heat > 0.5) col = o.warm[0];
            }
          }
          px(g, o.cx + x, y, col);
        }
      }
    }
  }
  var RIM = 175;
  var HIDE_TREE = { x: 292, base: HORIZON + 12 }; // the straitjacket figure slips behind this one

  function makeSky() {
    var cv = layer(), g = cv.getContext('2d');
    var bandsY = [[52, 'night0', 'night1'], [100, 'night1', 'night2']];
    for (var y = 0; y < HORIZON; y++) for (var x = 0; x < W; x++) {
      var c = 'night0';
      bandsY.forEach(function (bd) { var t = (y - bd[0] + 8) / 16; if (t >= 1) c = bd[2]; else if (t > 0 && bayer(x, y) < t) c = bd[2]; });
      px(g, x, y, C[c]);
    }
    // a faint band of stars across the sky, then brighter singles
    var sr = rng(11);
    for (var b = 0; b < 260; b++) {
      var bx = sr() * W, by = 10 + bx * 0.12 + (sr() + sr() + sr() - 1.5) * 18;
      if (by < 80) px(g, Math.floor(bx), Math.floor(by), sr() < 0.7 ? C.night2 : C.night3);
    }
    for (var s2 = 0; s2 < 80; s2++) {
      var x2 = Math.floor(sr() * W), y2 = Math.floor(sr() * 92), k = sr();
      px(g, x2, y2, k < 0.5 ? C.night3 : k < 0.85 ? C.steel : C.fog);
      if (k > 0.97) { px(g, x2 - 1, y2, C.night3); px(g, x2 + 1, y2, C.night3); px(g, x2, y2 - 1, C.night3); px(g, x2, y2 + 1, C.night3); }
    }
    // moon: halo, then a waning gibbous with craters
    var MX = 392, MY = 30;
    for (var hy = -20; hy <= 20; hy++) for (var hx = -20; hx <= 20; hx++) {
      var dd = Math.hypot(hx, hy);
      if (dd > 9 && dd < 20 && bayer(MX + hx, MY + hy) < (1 - (dd - 9) / 11) * 0.5) px(g, MX + hx, MY + hy, C.night2);
    }
    for (var my = -8; my <= 8; my++) for (var mx = -8; mx <= 8; mx++) {
      if (mx * mx + my * my > 64) continue;
      var shadow = (mx + 6) * (mx + 6) + my * my < 45; // the dark limb on the left
      var col = shadow ? (bayer(mx, my) < 0.3 ? C.night3 : C.night2) : (mx > 3 ? C.paper : C.paperShade);
      px(g, MX + mx, MY + my, col);
    }
    [[2, -3], [4, 2], [1, 4], [5, -1]].forEach(function (c) { px(g, MX + c[0], MY + c[1], C.paperDark); });
    rect(g, MX + 3, MY - 5, 2, 1, C.paperShade);
    return cv;
  }
  function makeFar(col) {
    var cv = layer(), g = cv.getContext('2d'), dark = col === C.night0;
    // mountains with moonlit right faces
    var prev = 0;
    for (var x = 0; x < W; x++) {
      var hh = Math.round(22 + 12 * Math.sin(x / 47 + 0.6) + 7 * Math.sin(x / 19 + 2) + 3 * Math.sin(x / 7));
      var slope = hh - prev; prev = hh;
      for (var y = HORIZON - hh; y < HORIZON; y++) {
        var c = col;
        if (!dark && slope < 0 && y < HORIZON - hh + 6 && bayer(x, y) < 0.6) c = C.night2;
        px(g, x, y, c);
      }
    }
    // low mist in the valley
    if (!dark) for (var my = HORIZON - 14; my < HORIZON; my++) for (var mx = 0; mx < W; mx++) {
      var t = (my - (HORIZON - 14)) / 14 * (0.55 + 0.25 * Math.sin(mx / 30));
      if (bayer(mx, my) < t * 0.6) px(g, mx, my, C.night2);
    }
    var tr = rng(23);
    for (var f = 0; f < 60; f++) {
      var fx = Math.floor(tr() * W), fh = 22 + Math.floor(tr() * 26);
      pine(g, { cx: fx, base: HORIZON + 2, h: fh, w: 11 + Math.floor(tr() * 8), seed: 100 + f,
        ramp: dark ? [col, col, col, col] : [C.night1, C.night1, C.night1, C.night2], trunk: [col, col] });
    }
    return cv;
  }
  function makeGround(level) {
    var cv = layer(), g = cv.getContext('2d');
    var img = g.createImageData(W, H), d = img.data;
    function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
    var P = {}; Object.keys(C).forEach(function (k) { P[k] = hex(C[k]); });
    var R = 158 + level * 7, r = rng(7);
    var bands = ['wood2', 'wood1', 'wood0', 'night2', 'night1'];
    var cuts = [0.2, 0.42, 0.64, 0.86];
    for (var y = HORIZON; y < H; y++) for (var x = 0; x < W; x++) {
      var t = Math.hypot(x - FX, (y - FY) * 2.7) / R + (bayer(x, y) - 0.5) * 0.1;
      var b = 0; while (b < cuts.length && t > cuts[b]) b++;
      var col = bands[b], n = r();
      if (n < 0.06 && b > 0) col = bands[b - 1];
      else if (n > 0.93 && b < 4) col = bands[b + 1];
      var o = (y * W + x) * 4, c = P[col];
      d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    // grass tufts, leaves and pebbles, coloured by how much firelight reaches them
    var gr = rng(41);
    function lightAt(x, y) { return Math.hypot(x - FX, (y - FY) * 2.7) / R; }
    for (var k = 0; k < 520; k++) {
      var tx = Math.floor(gr() * W), ty = HORIZON + 2 + Math.floor(gr() * (H - HORIZON - 2)), L = lightAt(tx, ty);
      if (L < 0.16) continue; // packed earth right by the fire
      var kind = gr();
      if (kind < 0.62) {
        var blades = 2 + Math.floor(gr() * 3), tall = ty > 200 ? 4 : ty > 160 ? 3 : 2;
        var cDark = L < 0.45 ? C.wood1 : L < 0.75 ? C.brown0 : C.night1;
        var cTip = L < 0.45 ? C.wood3 : L < 0.75 ? C.wood1 : C.night3;
        for (var bl = 0; bl < blades; bl++) {
          var bx = tx + bl * 2 - blades, hgt = tall - (bl % 2) + Math.floor(gr() * 2), lean = gr() < 0.5 ? -1 : 1;
          for (var hy = 0; hy < hgt; hy++) px(g, bx + (hy === hgt - 1 && hgt > 2 ? lean : 0), ty - hy, hy === hgt - 1 ? cTip : cDark);
        }
      } else if (kind < 0.85 && L < 0.7) {
        px(g, tx, ty, gr() < 0.5 ? C.brown2 : C.wood3); if (gr() < 0.5) px(g, tx + 1, ty, C.brown1);
      } else if (kind < 0.93) {
        rect(g, tx, ty, 3, 2, L < 0.6 ? C.night3 : C.night2); px(g, tx + 1, ty, L < 0.6 ? C.fog : C.steel); px(g, tx, ty + 1, C.night1);
      } else {
        rect(g, tx, ty, 4, 1, L < 0.6 ? C.wood2 : C.night2); px(g, tx + 4, ty - 1, L < 0.6 ? C.wood2 : C.night2); // twig
      }
    }
    return cv;
  }
  function makeMid() {
    var cv = layer(), g = cv.getContext('2d');
    var tr = rng(31), placed = [];
    for (var m = 0; m < 22 && placed.length < 15; m++) {
      var mx = Math.floor(tr() * W);
      var hh = 58 + Math.floor(tr() * 32), ww = 24 + Math.floor(tr() * 12), base = HORIZON + 8 + Math.floor(tr() * 6);
      if (Math.abs(mx - FX) < 34 || placed.some(function (p) { return Math.abs(p - mx) < 14; })) continue;
      placed.push(mx);
      pine(g, { cx: mx, base: base, h: hh, w: ww, seed: 300 + m, rim: RIM * 1.15,
        ramp: [C.night1, C.night2, C.night3, C.steel], warm: [C.wood0, null], trunk: [C.night1, C.night3] });
    }
    pine(g, { cx: HIDE_TREE.x, base: HIDE_TREE.base, h: 86, w: 34, seed: 299, rim: RIM * 1.15,
      ramp: [C.night1, C.night2, C.night3, C.steel], warm: [C.wood0, null], trunk: [C.night1, C.night3] });
    // It Walks: a trail of prints from its stump into the trees
    var prints = [[346, 160], [354, 155], [360, 149], [368, 145], [373, 140], [380, 136], [385, 132], [391, 129]];
    prints.forEach(function (p, i) { var x = p[0] + (i % 2) * 2; rect(g, x, p[1], i < 4 ? 2 : 1, 1, C.night0); px(g, x + (i < 4 ? 2 : 1), p[1], C.night0); if (i < 4) px(g, x + 3, p[1] - 1, C.night0); });
    // a fallen log to sit on, front left
    fallenLog(g, 150, 238, 46);
    // firewood stack, front right, with a hatchet
    woodpile(g, 300, 232);
    // fire pit: stones, a kettle, the logs
    for (var a = 0; a < 20; a++) {
      var ang = a / 20 * Math.PI * 2, sx = Math.round(FX + Math.cos(ang) * 26), sy = Math.round(FY + 1 + Math.sin(ang) * 8);
      if (Math.sin(ang) < -0.25) continue;
      var front = Math.sin(ang) > 0.3;
      rect(g, sx - 2, sy - 1, 5, 3, C.night2);
      rect(g, sx - 2, sy - 1, 4, 1, front ? C.wood2 : C.night3);
      px(g, sx - 1, sy - 1, front ? C.wood3 : C.steel);
      rect(g, sx - 2, sy + 1, 5, 1, C.night1);
    }
    kettle(g, FX - 30, FY + 6);
    var logs = [[-15, 1, -2, -9], [14, 2, 2, -10], [-9, 4, 1, -11], [10, 4, -1, -8], [0, 5, 0, -12]];

  // ---------- fit to the window ----------

  window.addEventListener('resize', fit); fit();

  // ---------- sound: everything synthesised, nothing loaded ----------

  // one footfall: a soft thump plus a little leaf crunch
  function footstep(t, pan, vol, wet, heavy) {

  function distantFootsteps() {
    var t = actx.currentTime + 0.1, pan = Math.random() < 0.5 ? -0.8 : 0.8, n = 5 + Math.floor(Math.random() * 6), gap = 0.55 + Math.random() * 0.2;

  // a child, far off in the trees: "mom?" — a buzz shaped by vowel formants, pitch rising at the end
  function childCall(t) {

  // music: a 36 second loop in D minor. Slow pad chords, a low drone, and a detuned music box.
  var LOOP = 36;
