<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- HUB -->
<title>Fireside Tales</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap">
<style>
/* One screen: the 480x270 pixel campfire, scaled whole-number where it can,
   with the story links as HTML buttons laid over their stumps. Night-only look. */
:root {
  --night0: #0b0d14;
  --night2: #232a40;
  --ember: #c88a45;
  --flame: #f2c27a;
  --paper: #d9cfb4;
  --paper-dim: #a89c80;
  --font-display: "Silkscreen", "Courier New", monospace;
  --font-body: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night0);
  color: var(--paper);
  font-family: var(--font-body);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
#wrap { height: 100%; display: grid; place-items: center; }
#stage { position: relative; }
#scene {
  display: block; width: 100%; height: 100%;
  image-rendering: pixelated; image-rendering: crisp-edges;
}
#title {
  position: absolute; left: 0; right: 0; top: 4.5%;
  text-align: center; pointer-events: none;
}
#title h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: max(calc(var(--u) * 15), 20px); letter-spacing: 0.08em;
  color: var(--flame); text-shadow: 0 calc(var(--u) * 1) 0 var(--night0), 0 0 calc(var(--u) * 6) rgba(200, 138, 69, 0.35);
}
#title p {
  margin: calc(var(--u) * 1) 0 0; font-size: max(calc(var(--u) * 9), 13px);
  color: var(--paper-dim); letter-spacing: 0.04em;
}
.tale {
  position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
  color: var(--paper); text-decoration: none; font: inherit;
  border-radius: calc(var(--u) * 3);
}
.tale .name {
  font-family: var(--font-display); font-size: max(calc(var(--u) * 6.4), 9px); line-height: 1.1;
  white-space: nowrap; color: var(--paper);
  text-shadow: 0 calc(var(--u) * 0.6) 0 var(--night0), 0 0 calc(var(--u) * 3) var(--night0);
}
.tale .soon {
  font-size: max(calc(var(--u) * 6.5), 11px); line-height: 1; color: var(--paper-dim);
  text-shadow: 0 0 calc(var(--u) * 2) var(--night0);
}
.tale:hover .name, .tale:focus-visible .name { color: var(--flame); }
.tale:focus-visible { outline: calc(var(--u) * 0.8) dashed var(--flame); outline-offset: calc(var(--u) * 1); }
#sound {
  position: absolute; right: calc(var(--u) * 6); top: calc(var(--u) * 6);
  font-family: var(--font-body); font-size: calc(var(--u) * 8);
  background: rgba(11, 13, 20, 0.6); color: var(--paper-dim);
  border: calc(var(--u) * 0.6) solid var(--night2); border-radius: calc(var(--u) * 2);
  padding: calc(var(--u) * 0.5) calc(var(--u) * 3); cursor: pointer;
}
#sound:hover, #sound:focus-visible { color: var(--flame); border-color: var(--ember); outline: none; }
#note {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -58%);
  width: calc(var(--u) * 190); max-width: 90%; box-sizing: border-box;
  background: var(--night0); border: calc(var(--u) * 1) solid var(--ember);
  box-shadow: 0 0 0 calc(var(--u) * 1) var(--night0), 0 0 calc(var(--u) * 20) rgba(200, 138, 69, 0.25);
  padding: calc(var(--u) * 9) calc(var(--u) * 10); text-align: center;
}
#note h2 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: calc(var(--u) * 10); color: var(--flame); text-wrap: balance;
}
#note p { margin: calc(var(--u) * 5) 0 calc(var(--u) * 7); font-size: calc(var(--u) * 9); line-height: 1.15; }
#note button {
  font-family: var(--font-display); font-size: calc(var(--u) * 6.5);
  background: var(--night2); color: var(--paper); cursor: pointer;
  border: calc(var(--u) * 0.6) solid var(--ember); padding: calc(var(--u) * 2) calc(var(--u) * 6);
}
#note button:hover, #note button:focus-visible { background: var(--ember); color: var(--night0); outline: none; }
#trophy-log {
  position: absolute; background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
  display: flex; align-items: flex-end; justify-content: center; font: inherit; color: var(--paper);
  border-radius: calc(var(--u) * 3);
}
#trophy-log .name {
  font-family: var(--font-display); font-size: max(calc(var(--u) * 6.4), 9px); line-height: 1.1; white-space: nowrap;
  transform: translateY(110%); opacity: 0; transition: opacity 0.2s; color: var(--flame);
  text-shadow: 0 calc(var(--u) * 0.6) 0 var(--night0), 0 0 calc(var(--u) * 3) var(--night0);
}
#trophy-log:hover .name, #trophy-log:focus-visible .name { opacity: 1; }
#trophy-log:focus-visible { outline: calc(var(--u) * 0.8) dashed var(--flame); outline-offset: calc(var(--u) * 1); }
#trophies {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: calc(var(--u) * 400); max-width: 96%; max-height: 94%; overflow: auto; box-sizing: border-box;
  background: var(--night0); border: calc(var(--u) * 1) solid var(--ember);
  box-shadow: 0 0 0 calc(var(--u) * 1) var(--night0), 0 0 calc(var(--u) * 20) rgba(200, 138, 69, 0.25);
  padding: calc(var(--u) * 7) calc(var(--u) * 8) calc(var(--u) * 8); text-align: center;
}
#trophies h2 {
  margin: 0 0 calc(var(--u) * 4); font-family: var(--font-display); font-weight: 400;
  font-size: calc(var(--u) * 10); color: var(--flame);
}
#trophies .sub { margin: calc(var(--u) * 1) 0 calc(var(--u) * 4); font-size: max(calc(var(--u) * 8), 11px); color: var(--paper-dim); }
#trophy-shelf { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
#trophy-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: calc(var(--u) * 3); margin: calc(var(--u) * 3) 0 calc(var(--u) * 6); text-align: center; }
#trophy-cards h3 {
  margin: 0 0 calc(var(--u) * 2); font-family: var(--font-display); font-weight: 400;
  font-size: max(calc(var(--u) * 5.6), 8px); line-height: 1.15; color: var(--paper);
}
#trophy-cards .won h3 { color: var(--flame); }
#trophy-cards ul { list-style: none; margin: 0; padding: 0; font-size: max(calc(var(--u) * 7.2), 11px); line-height: 1.05; }
#trophy-cards li { color: var(--paper-dim); margin-bottom: calc(var(--u) * 1.2); }
#trophy-cards li.got { color: var(--paper); }
#trophy-cards li::before { content: '\2606 '; color: var(--paper-dim); }
#trophy-cards li.got::before { content: '\2605 '; color: var(--flame); }
#trophy-cards .soon { font-size: max(calc(var(--u) * 6.5), 10px); color: var(--paper-dim); margin-top: calc(var(--u) * 1); }
#trophies button {
  font-family: var(--font-display); font-size: calc(var(--u) * 6.5);
  background: var(--night2); color: var(--paper); cursor: pointer;
  border: calc(var(--u) * 0.6) solid var(--ember); padding: calc(var(--u) * 2) calc(var(--u) * 6);
}
#trophies button:hover, #trophies button:focus-visible { background: var(--ember); color: var(--night0); outline: none; }
#fade {
  position: absolute; inset: 0; background: var(--night0); opacity: 0;
  pointer-events: none; transition: opacity 0.7s ease-in;
}
#fade.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #fade { transition: none; } }
</style>
<!-- /HUB -->
</head>
<body>
<!-- HUBBODY -->
<div id="wrap">
  <div id="stage">
    <canvas id="scene" width="480" height="270" aria-label="A low campfire in a clearing in the woods at night, with five stories set on stumps around it"></canvas>
    <div id="title"><h1>Fireside Tales</h1><p>Pull up a stump. Pick a tale.</p></div>
    <div id="tales"></div>
    <button id="sound" type="button" aria-pressed="false">Sound off</button>
    <div id="note" role="dialog" aria-modal="true" aria-labelledby="note-title" hidden>
      <h2 id="note-title"></h2>
      <p>This tale isn't ready to be told yet. Come back another night.</p>
      <button id="note-close" type="button">Back to the fire</button>
    </div>
    <button id="trophy-log" type="button" aria-haspopup="dialog"><span class="name">Trophies</span></button>
    <div id="trophies" role="dialog" aria-modal="true" aria-labelledby="trophies-title" hidden>
      <h2 id="trophies-title">Trophy Log</h2>
      <canvas id="trophy-shelf" width="240" height="60" aria-hidden="true"></canvas>
      <div id="trophy-cards"></div>
      <button id="trophies-close" type="button">Back to the fire</button>
    </div>
    <div id="fade"></div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var W = 480, H = 270;
  var C = {
    night0: '#0b0d14', night1: '#161a2a', night2: '#232a40', night3: '#39425e', steel: '#5b6684', fog: '#8d97b0',
    wood0: '#2a180d', wood1: '#3a2414', wood2: '#5e3a1f', wood3: '#8a5a2e', lamp3: '#c88a45', lamp4: '#f2c27a',
    paper: '#d9cfb4', paperShade: '#a89c80', paperDark: '#6e6552',
    brown0: '#2e1f17', brown1: '#4f3527', brown2: '#7a5640',
    crt0: '#0f2a1c', crt1: '#2f8f5a', crt2: '#7dffb0',
    skinA0: '#5a3428', skinA1: '#9a634c', skinA2: '#d29a78',
    red0: '#5c1a22', red1: '#a8323a', fut1: '#3fe0ff', flash: '#eef4ff'
  };

  // Where Emit Time lives: next to this page on GitHub Pages or from disk,
  // otherwise (inside a claude.ai artifact) the published site in a new tab.
  var local = location.protocol === 'file:' || /github\.io$/.test(location.hostname) || location.hostname === 'localhost';
  var SITE = local ? '' : 'https://vertith.github.io/Fireside_Tales/';

  var FX = 240, FY = 200; // fire base
  var TALES = [
    { id: 'emit', name: 'Emit Time', x: 92, y: 204, ready: true, url: local ? 'game/index.html' : SITE + 'game/' },
    { id: 'asylum', name: 'The Asylum', x: 148, y: 164 },
    { id: 'intruders', name: 'Intruders', x: 240, y: 150 },
    { id: 'walks', name: 'It Walks', x: 332, y: 164 },
    { id: 'lab', name: 'The Lab', x: 388, y: 204, ready: true, url: local ? 'stories/lab/index.html' : SITE + 'stories/lab/' }

  function px(g, x, y, c) { g.fillStyle = c; g.fillRect(x, y, 1, 1); }
  function sprite(g, rows, map, x, y) {
    for (var j = 0; j < rows.length; j++) for (var i = 0; i < rows[j].length; i++) {
      var ch = rows[j][i]; if (ch !== '.' && map[ch]) px(g, x + i, y + j, map[ch]);
    }
  }
  function outline(g, rows, x, y, c) {
    g.fillStyle = c;
    for (var j = -1; j <= rows.length; j++) for (var i = -1; i <= rows[0].length; i++) {
      var on = rows[j] && rows[j][i] && rows[j][i] !== '.';
      if (on) continue;
      var n = [[0, 1], [0, -1], [1, 0], [-1, 0]].some(function (d) { var r = rows[j + d[1]]; return r && r[i + d[0]] && r[i + d[0]] !== '.'; });
      if (n) g.fillRect(x + i, y + j, 1, 1);
    }
  }

  // ---------- static scene, built once in layers ----------
  // sky > far ridge, fog and far pines > lit ground (three flicker levels) > mid pines and the camp > near pines
  var HORIZON = 124;
  var clamp01 = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
  function layer() { var cv = document.createElement('canvas'); cv.width = W; cv.height = H; return cv; }

  // A pine built from drooping tiers of needles. Light comes from the moon (upper right) and,
  // for trees near the clearing, warm firelight on the side facing the fire.
  // o: { cx, base, h, w, ramp: [shadow, base, lit, moon], warm: [dim, bright] | null, rim, seed, trunk: [dark, lit] }
  function pine(g, o) {
    var r = rng(o.seed || 1), top = o.base - o.h;
    var crownBot = o.base - Math.round(o.h * 0.14);
    var n = Math.max(4, Math.round(o.h / 13));
    var face = o.cx < FX ? 1 : -1; // which side looks at the fire
    // trunk with bark streaks
    var tw = Math.max(2, Math.round(o.w / 12));
    for (var ty = crownBot - 6; ty <= o.base; ty++) for (var tx = -Math.floor(tw / 2); tx < Math.ceil(tw / 2); tx++) {
      var lit = tx * face >= Math.floor(tw / 2) - 1;
      var c = (r() < 0.25) ? o.trunk[0] : lit ? o.trunk[1] : o.trunk[0];
      if (o.warm && lit) { var dd = Math.hypot(o.cx - FX, (ty - FY) * 1.6); if (dd < o.rim * 0.6) c = o.warm[0]; }
      px(g, o.cx + tx, ty, c);
    }
    if (tw >= 3) { rect(g, o.cx - Math.floor(tw / 2) - 1, o.base, tw + 2, 1, o.trunk[0]); }
    // tiers, bottom first so each upper tier's fringe hangs over the one below
    for (var i = n - 1; i >= 0; i--) {
      var tTop = top + Math.round((crownBot - top) * (i / n) * 0.9);
      var tBot = top + Math.round((crownBot - top) * ((i + 1) / n)) + 2;
      var tHalf = (o.w / 2) * (0.18 + 0.82 * Math.pow((i + 1) / n, 0.9));
      var tr = rng((o.seed || 1) * 31 + i);
      for (var y = tTop; y <= tBot; y++) {
        var f = (y - tTop) / Math.max(1, tBot - tTop);
        var half = Math.round(tHalf * (0.1 + 0.9 * Math.pow(f, 0.8)));
        if (i === 0 && y === tTop) half = 0;
        var rowsLeft = tBot - y;
        for (var x = -half; x <= half; x++) {
          var ax = x + 64 + i * 2;
          if (rowsLeft === 0 && (ax % 3 !== 1)) continue;                              // hanging needle tips
          if (rowsLeft === 1 && Math.abs(x) > half * 0.7 && ax % 3 === 0) continue;
          var nx = half ? x / half : 0;
          var zone = f < 0.2 ? 0 : nx < -0.72 ? 0 : nx < 0.2 ? 1 : 2;
          if (zone === 1 && (ax - y + 400) % 4 === 0) zone = 0;                          // needle strokes
          else if (zone === 2 && (ax + y) % 4 === 0) zone = 1;
          if (tr() < 0.05) zone = Math.max(0, zone - 1);
          var col = o.ramp[zone];
          if (f > 0.55 && x >= half - 1 && x > 0) col = o.ramp[3];                      // moonlit edge
          if (o.warm) {
            var fs = nx * face, d = Math.hypot(o.cx + x - FX, (y - FY) * 1.6), k = clamp01(1 - d / o.rim);
            if (fs > 0.2 && f > 0.3) {
              var heat = k * (0.4 + fs) + (bayer(o.cx + x, y) - 0.5) * 0.12;
              if (heat > 0.85 && o.warm[1]) col = o.warm[1]; else if (heat > 0.5) col = o.warm[0];
            }
          }
          px(g, o.cx + x, y, col);
        }
      }
    }
  }
  // A broad oak: a thick, slightly leaning trunk forking into limbs, under a dome of leaf clumps.
  // Same lighting as the pines: moon from the upper right, firelight on the side facing the clearing.
  function oak(g, o) {
    var r = rng(o.seed || 1), top = o.base - o.h, face = o.cx < FX ? 1 : -1;
    var tw = Math.max(3, Math.round(o.w / 8)), lean = (r() - 0.5) * 4;
    var crownBot = o.base - Math.round(o.h * 0.42);
    // limbs: trunk to a fork, then three limbs up into the crown
    var fork = [o.cx + lean, crownBot + 4];
    var limbs = [[fork, [o.cx - o.w * 0.28, top + o.h * 0.3]], [fork, [o.cx + o.w * 0.26, top + o.h * 0.26]], [fork, [o.cx + lean * 0.5, top + o.h * 0.12]]];
    function thick(a, b, r0, r1, colFn) {
      var n = Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) * 2);
      for (var i = 0; i <= n; i++) {
        var k = i / n, x = a[0] + (b[0] - a[0]) * k, y = a[1] + (b[1] - a[1]) * k, rr = r0 + (r1 - r0) * k;
        for (var dx = -Math.ceil(rr); dx <= Math.ceil(rr); dx++) if (Math.abs(dx) <= rr) px(g, Math.round(x + dx), Math.round(y), colFn(dx / Math.max(1, rr), Math.round(y)));
      }
    }
    function bark(nx, y) {
      var lit = nx * face > 0.3;
      var c = lit ? o.trunk[1] : o.trunk[0];
      if (r() < 0.18) c = o.trunk[0];
      if (o.warm && lit) { var dd = Math.hypot(o.cx - FX, (y - FY) * 1.6); if (dd < o.rim * 0.6) c = o.warm[0]; }
      return c;
    }
    thick([o.cx, o.base], fork, tw / 2 + 0.6, tw / 2 - 0.4, bark);
    rect(g, o.cx - tw / 2 - 2, o.base, tw + 4, 1, o.trunk[0]); px(g, Math.round(o.cx - tw / 2 - 2), o.base - 1, o.trunk[0]); px(g, Math.round(o.cx + tw / 2 + 1), o.base - 1, o.trunk[0]);
    limbs.forEach(function (l) { thick(l[0], l[1], tw / 2 - 0.5, 0.5, bark); });
    // crown: overlapping leaf clumps over a broad dome
    var clumps = [], nC = 7 + Math.floor(o.w / 10);
    for (var i = 0; i < nC; i++) {
      var a = (i / (nC - 1)) * Math.PI, rad = o.w * (0.17 + r() * 0.08);
      clumps.push([o.cx + Math.cos(Math.PI - a) * o.w * 0.34 + (r() - 0.5) * 4, top + o.h * 0.3 - Math.sin(a) * o.h * 0.14 + (r() - 0.5) * 4, rad]);
    }
    clumps.push([o.cx - o.w * 0.18, top + o.h * 0.4, o.w * 0.2], [o.cx + o.w * 0.2, top + o.h * 0.42, o.w * 0.19], [o.cx, top + o.h * 0.22, o.w * 0.24]);
    var x0 = Math.floor(o.cx - o.w * 0.75), x1 = Math.ceil(o.cx + o.w * 0.75);
    for (var y = top - 4; y <= crownBot + 6; y++) for (var x = x0; x <= x1; x++) {
      // the top-most (last) clump covering this pixel decides its shading
      var hit = null;
      for (var c = 0; c < clumps.length; c++) {
        var cl = clumps[c], ddx = x - cl[0], ddy = (y - cl[1]) * 1.15, rr = cl[2] + ((x * 13 + y * 7) % 3 === 0 ? -1 : 0);
        if (ddx * ddx + ddy * ddy <= rr * rr) hit = [ddx / cl[2], ddy / cl[2]];
      }
      if (!hit) continue;
      if (y > crownBot - 2 && ((x + y) % 3 === 0)) continue;                      // ragged underside
      var leaf = (((x >> 1) * 73856093) ^ ((y >> 1) * 19349663)) >>> 0;             // 2x2 leaf clusters
      var v = 0.5 + 0.32 * hit[0] - 0.34 * hit[1] + ((leaf % 7) / 6 - 0.5) * 0.3;
      if (y > crownBot - 6) v -= 0.25;                                              // shade under the canopy
      var col = v < 0.34 ? o.ramp[0] : v < 0.66 ? o.ramp[1] : o.ramp[2];
      if (v > 0.86 && leaf % 3 === 0) col = o.ramp[3];
      if (o.warm) {
        var fs = hit[0] * face, d = Math.hypot(x - FX, (y - FY) * 1.6), k = clamp01(1 - d / o.rim);
        if (fs > 0.1 && hit[1] > -0.2) { var heat = k * (0.4 + fs) + (bayer(x, y) - 0.5) * 0.12; if (heat > 0.85 && o.warm[1]) col = o.warm[1]; else if (heat > 0.5) col = o.warm[0]; }
      }
      px(g, x, y, col);
    }
    // a couple of limbs showing through the underside of the canopy
    limbs.slice(0, 2).forEach(function (l) { var m = [(l[0][0] + l[1][0]) / 2, (l[0][1] + l[1][1]) / 2]; thick(l[0], m, tw / 2 - 0.5, tw / 4, bark); });
  }
  // A low bush: a mound of small leaf clumps, lit like the trees.
  function bush(g, o) {
    var r = rng(o.seed), face = o.cx < FX ? 1 : -1, clumps = [], cells = {};
    var n = 5 + Math.floor(o.w / 4);
    for (var i = 0; i < n; i++) {
      var u = i / (n - 1) - 0.5;
      clumps.push([o.cx + u * o.w * 0.8 + (r() - 0.5) * 3, o.base - o.h * (0.45 + 0.35 * Math.cos(u * Math.PI)) + (r() - 0.5) * 2, o.h * (0.42 + r() * 0.2)]);
    }

    if (Math.random() < 1 / 420) { var t = actx.currentTime + 0.2; childCall(t); if (Math.random() < 0.4) childCall(t + 3.5); }
  }, 1000);
  setInterval(function () { // ease the wind toward its target and let the wind bed follow
    wind.level += (wind.target - wind.level) * 0.06;
    if (actx && soundOn) {
      windGain.gain.setTargetAtTime(0.01 + wind.level * 0.05, actx.currentTime, 0.5);
      windFilter.frequency.setTargetAtTime(380 + wind.level * 320, actx.currentTime, 0.6);
      // the fire breathes: slow random swells, a little livelier when the wind feeds it
      fireLife += (Math.random() - 0.5) * 0.12; fireLife = Math.max(-1, Math.min(1, fireLife * 0.98));
      var lift = 1 + fireLife * 0.25 + wind.level * 0.3;
      fire.roar.gain.gain.setTargetAtTime(fire.roar.base * lift, actx.currentTime, 0.3);
      fire.tick.gain.gain.setTargetAtTime(fire.tick.base * (0.8 + fireLife * 0.3 + wind.level * 0.4), actx.currentTime, 0.2);
      fire.hiss.gain.gain.setTargetAtTime(fire.hiss.base * lift, actx.currentTime, 0.4);
    }
  }, 100);
  window.FIRESIDE.sound = { child: function () { if (actx) childCall(actx.currentTime + 0.1); }, laugh: function () { childLaugh(); }, help: function () { helpMe(); }, creak: function () { creak(); }, steps: function () { if (actx) distantFootsteps(); }, gust: function () { wind.target = 1; wind.until = Date.now() + 7000; } };

  var sb = document.getElementById('sound');
  sb.addEventListener('click', function () {
    soundOn = !soundOn;
    sb.textContent = soundOn ? 'Sound on' : 'Sound off';
    sb.setAttribute('aria-pressed', String(soundOn));
    if (soundOn) startSound(); else { clearTimeout(crackleTimer); if (actx) actx.suspend(); }
  });
})();
</script>
