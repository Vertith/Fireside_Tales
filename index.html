<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- HUB -->
<title>Fireside Tales</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap">
<style>
/* One screen: the 480x270 pixel campfire, scaled whole-number where it can,
   with the story links as HTML buttons laid over their stumps. Night-only look. */
:root {
  --night0: #0b0d14;
  --night2: #232a40;
  --ember: #c88a45;
  --flame: #f2c27a;
  --paper: #d9cfb4;
  --paper-dim: #a89c80;
  --font-display: "Silkscreen", "Courier New", monospace;
  --font-body: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night0);
  color: var(--paper);
  font-family: var(--font-body);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
#wrap { height: 100%; display: grid; place-items: center; }
#stage { position: relative; }
#scene {
  display: block; width: 100%; height: 100%;
  image-rendering: pixelated; image-rendering: crisp-edges;
}
#title {
  position: absolute; left: 0; right: 0; top: 4.5%;
  text-align: center; pointer-events: none;
}
#title h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: max(calc(var(--u) * 15), 20px); letter-spacing: 0.08em;
  color: var(--flame); text-shadow: 0 calc(var(--u) * 1) 0 var(--night0), 0 0 calc(var(--u) * 6) rgba(200, 138, 69, 0.35);
}
#title p {
  margin: calc(var(--u) * 1) 0 0; font-size: max(calc(var(--u) * 9), 13px);
  color: var(--paper-dim); letter-spacing: 0.04em;
}
.tale {
  position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
  color: var(--paper); text-decoration: none; font: inherit;
  border-radius: calc(var(--u) * 3);
}
.tale .name {
  font-family: var(--font-display); font-size: max(calc(var(--u) * 6.4), 9px); line-height: 1.1;
  white-space: nowrap; color: var(--paper);
  text-shadow: 0 calc(var(--u) * 0.6) 0 var(--night0), 0 0 calc(var(--u) * 3) var(--night0);
}
.tale .soon {
  font-size: max(calc(var(--u) * 6.5), 11px); line-height: 1; color: var(--paper-dim);
  text-shadow: 0 0 calc(var(--u) * 2) var(--night0);
}
.tale:hover .name, .tale:focus-visible .name { color: var(--flame); }
.tale:focus-visible { outline: calc(var(--u) * 0.8) dashed var(--flame); outline-offset: calc(var(--u) * 1); }
#sound {
  position: absolute; right: calc(var(--u) * 6); top: calc(var(--u) * 6);
  font-family: var(--font-body); font-size: calc(var(--u) * 8);
  background: rgba(11, 13, 20, 0.6); color: var(--paper-dim);
  border: calc(var(--u) * 0.6) solid var(--night2); border-radius: calc(var(--u) * 2);
  padding: calc(var(--u) * 0.5) calc(var(--u) * 3); cursor: pointer;
}
#sound:hover, #sound:focus-visible { color: var(--flame); border-color: var(--ember); outline: none; }
#note {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -58%);
  width: calc(var(--u) * 190); max-width: 90%; box-sizing: border-box;
  background: var(--night0); border: calc(var(--u) * 1) solid var(--ember);
  box-shadow: 0 0 0 calc(var(--u) * 1) var(--night0), 0 0 calc(var(--u) * 20) rgba(200, 138, 69, 0.25);
  padding: calc(var(--u) * 9) calc(var(--u) * 10); text-align: center;
}
#note h2 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: calc(var(--u) * 10); color: var(--flame); text-wrap: balance;
}
#note p { margin: calc(var(--u) * 5) 0 calc(var(--u) * 7); font-size: calc(var(--u) * 9); line-height: 1.15; }
#note button {
  font-family: var(--font-display); font-size: calc(var(--u) * 6.5);
  background: var(--night2); color: var(--paper); cursor: pointer;
  border: calc(var(--u) * 0.6) solid var(--ember); padding: calc(var(--u) * 2) calc(var(--u) * 6);
}
#note button:hover, #note button:focus-visible { background: var(--ember); color: var(--night0); outline: none; }
#fade {
  position: absolute; inset: 0; background: var(--night0); opacity: 0;
  pointer-events: none; transition: opacity 0.7s ease-in;
}
#fade.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #fade { transition: none; } }
</style>
<!-- /HUB -->
</head>
<body>
<!-- HUBBODY -->
<div id="wrap">
  <div id="stage">
    <canvas id="scene" width="480" height="270" aria-label="A low campfire in a clearing in the woods at night, with five stories set on stumps around it"></canvas>
    <div id="title"><h1>Fireside Tales</h1><p>Pull up a stump. Pick a tale.</p></div>
    <div id="tales"></div>
    <button id="sound" type="button" aria-pressed="false">Sound off</button>
    <div id="note" role="dialog" aria-modal="true" aria-labelledby="note-title" hidden>
      <h2 id="note-title"></h2>
      <p>This tale isn't ready to be told yet. Come back another night.</p>
      <button id="note-close" type="button">Back to the fire</button>
    </div>
    <div id="fade"></div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var W = 480, H = 270;
  var C = {
    night0: '#0b0d14', night1: '#161a2a', night2: '#232a40', night3: '#39425e', steel: '#5b6684', fog: '#8d97b0',
    wood0: '#2a180d', wood1: '#3a2414', wood2: '#5e3a1f', wood3: '#8a5a2e', lamp3: '#c88a45', lamp4: '#f2c27a',
    paper: '#d9cfb4', paperShade: '#a89c80', paperDark: '#6e6552',
    brown0: '#2e1f17', brown1: '#4f3527', brown2: '#7a5640',
    crt0: '#0f2a1c', crt1: '#2f8f5a', crt2: '#7dffb0',
    red0: '#5c1a22', red1: '#a8323a', fut1: '#3fe0ff', flash: '#eef4ff'
  };

  // Where Emit Time lives: next to this page on GitHub Pages or from disk,
  // otherwise (inside a claude.ai artifact) the published site in a new tab.
  var local = location.protocol === 'file:' || /github\.io$/.test(location.hostname) || location.hostname === 'localhost';
  var EMIT_URL = local ? 'game/index.html' : 'https://vertith.github.io/Emit-Time/game/';

  var FX = 240, FY = 200; // fire base
  var TALES = [
    { id: 'emit', name: 'Emit Time', x: 92, y: 204, ready: true },
    { id: 'asylum', name: 'The Asylum', x: 148, y: 164 },
    { id: 'upstairs', name: 'Upstairs', x: 240, y: 150 },
    { id: 'walks', name: 'It Walks', x: 332, y: 164 },
    { id: 'lab', name: 'The Lab', x: 388, y: 204 }
  ];

  // ---------- helpers ----------
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  function bayer(x, y) { return (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16; }
  function rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
  function px(g, x, y, c) { g.fillStyle = c; g.fillRect(x, y, 1, 1); }
  function sprite(g, rows, map, x, y) {
    for (var j = 0; j < rows.length; j++) for (var i = 0; i < rows[j].length; i++) {
      var ch = rows[j][i]; if (ch !== '.' && map[ch]) px(g, x + i, y + j, map[ch]);
    }
  }
  function outline(g, rows, x, y, c) {
    g.fillStyle = c;
    for (var j = -1; j <= rows.length; j++) for (var i = -1; i <= rows[0].length; i++) {
      var on = rows[j] && rows[j][i] && rows[j][i] !== '.';
      if (on) continue;
      var n = [[0, 1], [0, -1], [1, 0], [-1, 0]].some(function (d) { var r = rows[j + d[1]]; return r && r[i + d[0]] && r[i + d[0]] !== '.'; });
      if (n) g.fillRect(x + i, y + j, 1, 1);
    }
  }

  // ---------- static backdrop (three flicker levels of firelight) ----------
  var HORIZON = 124;
  function pine(g, cx, base, h, w, col, rim) {
    // trunk
    rect(g, cx - 1, base - Math.round(h * 0.18), 3, Math.round(h * 0.18) + 1, col);
    var top = base - h;
    for (var y = top; y < base - Math.round(h * 0.12); y++) {
      var t = (y - top) / (h * 0.88);
      var tier = (t * 4) % 1;               // four jagged tiers
      var half = Math.max(0, Math.round((w / 2) * (0.25 + 0.75 * t) * (0.55 + 0.45 * tier)));
      rect(g, cx - half, y, half * 2 + 1, 1, col);
      if (rim) {
        var side = cx < FX ? 1 : -1;
        var ex = cx + side * half;
        var d = Math.hypot(ex - FX, (y - FY) * 1.6);
        if (d < rim && y > top + 4 && bayer(ex, y) < 1 - d / rim) px(g, ex, y, C.wood0);
      }
    }
  }
  function makeBackdrop(level) {
    var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    var g = cv.getContext('2d');
    var img = g.createImageData(W, H), d = img.data;
    function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
    var P = {}; Object.keys(C).forEach(function (k) { P[k] = hex(C[k]); });
    var R = 158 + level * 7, r = rng(7);
    var bands = ['wood2', 'wood1', 'wood0', 'night2', 'night1'];
    var cuts = [0.2, 0.42, 0.64, 0.86];
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var col;
      if (y < HORIZON) {
        col = (y > 70 && bayer(x, y) < (y - 70) / 70) ? 'night1' : 'night0';
      } else {
        var t = Math.hypot(x - FX, (y - FY) * 2.7) / R + (bayer(x, y) - 0.5) * 0.1;
        var b = 0; while (b < cuts.length && t > cuts[b]) b++;
        col = bands[b];
        var n = r();
        if (n < 0.05 && b > 0) col = bands[b - 1];      // grass glints
        else if (n > 0.95 && b < 4) col = bands[b + 1];
      }
      var o = (y * W + x) * 4, c = P[col];
      d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
    }
    g.putImageData(img, 0, 0);

    // stars and moon
    var sr = rng(11);
    for (var s = 0; s < 70; s++) px(g, Math.floor(sr() * W), Math.floor(sr() * 90), sr() < 0.25 ? C.fog : C.night3);
    rect(g, 352, 22, 1, 1, C.paperShade);
    for (var my = -7; my <= 7; my++) for (var mx = -7; mx <= 7; mx++) {
      if (mx * mx + my * my <= 49 && (mx + 4) * (mx + 4) + (my - 2) * (my - 2) > 36) px(g, 356 + mx, 30 + my, mx > 2 ? C.paper : C.paperShade);
    }

    // far ridge and tree lines
    for (var x2 = 0; x2 < W; x2++) {
      var hh = Math.round(10 + 6 * Math.sin(x2 / 37) + 4 * Math.sin(x2 / 13 + 1));
      rect(g, x2, HORIZON - hh, 1, hh, C.night1);
    }
    var tr = rng(23);
    for (var f = 0; f < 46; f++) { var fx = Math.floor(tr() * W); pine(g, fx, HORIZON + 2, 26 + Math.floor(tr() * 26), 12 + Math.floor(tr() * 8), C.night1); }
    for (var m = 0; m < 16; m++) {
      var mx2 = Math.floor(tr() * W);
      if (Math.abs(mx2 - FX) < 30) continue;
      pine(g, mx2, HORIZON + 8 + Math.floor(tr() * 6), 60 + Math.floor(tr() * 30), 22 + Math.floor(tr() * 10), C.night2, R * 1.1);
    }

    // It Walks: a trail of prints from its stump into the trees
    var prints = [[346, 160], [354, 155], [360, 149], [368, 145], [373, 140], [380, 136], [385, 132], [391, 129]];
    prints.forEach(function (p, i) { rect(g, p[0] + (i % 2) * 2, p[1], i < 4 ? 2 : 1, 1, C.night0); px(g, p[0] + (i % 2) * 2 + 2, p[1], C.night0); });

    // stone ring and logs
    for (var a = 0; a < 18; a++) {
      var ang = a / 18 * Math.PI * 2, sx = Math.round(FX + Math.cos(ang) * 25), sy = Math.round(FY + Math.sin(ang) * 7);
      if (Math.sin(ang) < -0.2) continue; // back stones hide behind the flames
      rect(g, sx - 2, sy - 1, 4, 3, C.night2); rect(g, sx - 2, sy - 1, 3, 1, Math.sin(ang) > 0.3 ? C.steel : C.night3);
    }
    for (var l = 0; l < 18; l++) { rect(g, FX - 13 + l, FY - 3 + Math.round(l / 6), 1, 3, l % 5 ? C.wood1 : C.wood2); rect(g, FX + 12 - l, FY - 3 + Math.round(l / 6), 1, 3, l % 4 ? C.wood2 : C.wood1); }
    rect(g, FX - 6, FY - 1, 12, 2, C.red0);

    // near framing pines, dark against the firelight
    pine(g, 22, 282, 250, 90, C.night0, R);
    pine(g, 64, 252, 170, 52, C.night0, R);
    pine(g, 460, 282, 250, 90, C.night0, R);
    pine(g, 418, 248, 160, 48, C.night0, R);
    // foreground grass
    var gr = rng(5);
    for (var gx = 0; gx < W; gx++) { var gh = 2 + Math.floor(gr() * 5); if (gr() < 0.6) rect(g, gx, H - gh, 1, gh, C.night0); }
    TALES.forEach(function (t) { stump(g, t.x, t.y); });
    return cv;
  }
  function stump(g, cx, top) {
    var lit = cx < FX ? 1 : cx > FX ? -1 : 0;
    for (var i = -10; i < 10; i++) {
      var c = C.wood1;
      if ((lit === 1 && i > 4) || (lit === -1 && i < -5) || (lit === 0 && Math.abs(i) > 7)) c = C.wood2;
      if ((lit === 1 && i < -6) || (lit === -1 && i > 6)) c = C.wood0;
      rect(g, cx + i, top, 1, 8 + (Math.abs(i) < 9 ? 1 : 0), c);
      if (i % 4 === 1) rect(g, cx + i, top + 2, 1, 5, C.wood0);
    }
    var widths = [12, 18, 20, 20, 18];
    widths.forEach(function (w, j) { rect(g, cx - w / 2, top - 3 + j, w, 1, j === 0 ? C.wood3 : C.wood3); });
    rect(g, cx - 7, top - 1, 14, 1, C.wood2); rect(g, cx - 3, top, 6, 1, C.wood2);
    rect(g, cx - 1, top - 1, 2, 1, C.lamp3);
    rect(g, cx - 11, top + 9, 22, 1, C.night0); // contact shadow
  }

  // ---------- props ----------
  var PROPS = {
    emit: { rows: [
      '....yyy....',
      '....y.y....',
      '...ppppp...',
      '..pPPPPPp..',
      '.pPWWWWWPp.',
      '.pPWWkWWPp.',
      '.pPWWkWWPp.',
      '.pPWWkkWPp.',
      '.pPWWWWWPp.',
      '..pPWWWPp..',
      '...ppppp...'
    ], map: { y: C.lamp3, p: C.wood3, P: C.lamp4, W: C.paper, k: C.night0 } },
    asylum: { rows: [
      '...ssss.....',
      '..s....s....',
      '.s......s...',
      '.s......s...',
      '..s....f....',
      '...ssf.f....',
      '....f..f.tt.',
      '....f..fttt.',
      '...ff..fttt.',
      '...f..ff.tt.',
      '..ff..f.....'
    ], map: { s: C.steel, f: C.fog, t: C.paperShade } },
    upstairs: { rows: [
      '....WWW....',
      '....WWw....',
      '....WWw....',
      '...WWWw....',
      '....WWw....',
      '....WWw....',
      '..bbbbbbb..',
      '.bBBBBBBBb.',
      '..bbbbbbb..'
    ], map: { W: C.paper, w: C.paperShade, b: C.wood3, B: C.lamp3 } },
    walks: { rows: [
      '...bbbb....',
      '...bBBb....',
      '...bBkb....',
      '...bBBb....',
      '...bBkb....',
      '..bbBBbbb..',
      '.bBBBBBBBb.',
      '.bBBBBBBBBb',
      '.kkkkkkkkkk'
    ], map: { b: C.brown1, B: C.brown2, k: C.brown0 } },
    lab: { rows: [
      '....ggg....',
      '....g.g....',
      '....g.g....',
      '...g...g...',
      '...gLLLg...',
      '..gLLLLLg..',
      '.gLLLLLLLg.',
      '.gLLLLLLLg.',
      'ggggggggggg'
    ], map: { g: C.fog, L: C.crt1 } }
  };
  function propOrigin(t) { var p = PROPS[t.id]; return [t.x - Math.floor(p.rows[0].length / 2), t.y - 3 - p.rows.length]; }

  // ---------- fire (doom-fire style heat buffer, kept low) ----------
  var FW = 36, FH = 30, heat = new Uint8Array(FW * FH);
  var FIRE_COL = [null, C.red1, C.red1, C.red1, C.lamp3, C.lamp3, C.lamp4, C.flash];
  function stepFire() {
    for (var x = 0; x < FW; x++) {
      var c = Math.abs(x - FW / 2) / (FW / 2);
      heat[(FH - 1) * FW + x] = c < 0.62 ? Math.max(0, Math.round(7.4 - c * 5 - Math.random() * 2.2)) : 0;
    }
    for (var y = 1; y < FH; y++) for (var x2 = 0; x2 < FW; x2++) {
      var v = heat[y * FW + x2], rnd = Math.floor(Math.random() * 3);
      var dx = Math.min(FW - 1, Math.max(0, x2 - rnd + 1));
      heat[(y - 1) * FW + dx] = Math.max(0, v - (Math.random() < 0.42 ? 1 : 0));
    }
  }

  // ---------- render loop ----------
  var canvas = document.getElementById('scene'), g = canvas.getContext('2d');
  g.imageSmoothingEnabled = false;
  var backdrops = [0, 1, 2].map(makeBackdrop);
  var level = 1, hover = null, tick = 0, embers = [], smoke = [];
  var tw = rng(99), twinkles = [];
  for (var i = 0; i < 6; i++) twinkles.push([Math.floor(tw() * 300) + 90, Math.floor(tw() * 60) + 4]);
  var bubbles = [];
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw() {
    g.drawImage(backdrops[level], 0, 0);
    twinkles.forEach(function (s, k) { if ((tick + k * 7) % 40 < 3) px(g, s[0], s[1], C.paperShade); });
    // fire
    for (var y = 0; y < FH; y++) for (var x = 0; x < FW; x++) {
      var v = heat[y * FW + x]; if (v) px(g, FX - FW / 2 + x, FY - FH + y, FIRE_COL[v]);
    }
    if (tick % 3 === 0) for (var e = 0; e < 4; e++) px(g, FX - 7 + Math.floor(Math.random() * 14), FY - 1 + Math.floor(Math.random() * 2), Math.random() < 0.5 ? C.lamp3 : C.red1);
    smoke.forEach(function (s) { px(g, Math.round(s.x), Math.round(s.y), s.y < FY - 50 ? C.night1 : C.night2); });
    embers.forEach(function (p) { px(g, Math.round(p.x), Math.round(p.y), p.life > 14 ? C.lamp4 : C.red1); });
    // props
    TALES.forEach(function (t) {
      var p = PROPS[t.id], o = propOrigin(t);
      if (hover === t.id) outline(g, p.rows, o[0], o[1], C.lamp4);
      sprite(g, p.rows, p.map, o[0], o[1]);
      if (t.id === 'emit' && tick % 50 < 4) px(g, o[0] + 7, o[1] + 4, C.fut1);
      if (t.id === 'upstairs') { // candle flame
        var fl = tick % 6 < 3 ? 0 : 1;
        px(g, o[0] + 5, o[1] - 1, C.night0);
        px(g, o[0] + 5, o[1] - 2, C.lamp3); px(g, o[0] + 5 - fl, o[1] - 3, C.lamp4); px(g, o[0] + 5, o[1] - 4 - fl, C.lamp4);
      }
      if (t.id === 'lab') bubbles.forEach(function (b) { px(g, o[0] + b.x, o[1] + Math.round(b.y), C.crt2); });
    });
  }
  function update() {
    tick++;
    stepFire();
    if (tick % 4 === 0) { var n = level + (Math.random() < 0.5 ? -1 : 1); level = Math.max(0, Math.min(2, n)); }
    if (Math.random() < 0.18) embers.push({ x: FX - 5 + Math.random() * 10, y: FY - 10, vx: (Math.random() - 0.5) * 0.6, life: 26 + Math.random() * 20 });
    embers = embers.filter(function (p) { p.x += p.vx + Math.sin((tick + p.life) / 5) * 0.3; p.y -= 0.9; return --p.life > 0; });
    if (tick % 5 === 0) smoke.push({ x: FX - 2 + Math.random() * 4, y: FY - 22, life: 40 });
    smoke = smoke.filter(function (s) { s.y -= 0.6; s.x += 0.25 + Math.sin(s.y / 6) * 0.3; return --s.life > 0; });
    if (Math.random() < 0.15) bubbles.push({ x: 3 + Math.floor(Math.random() * 5), y: 7 });
    bubbles = bubbles.filter(function (b) { b.y -= 0.35; return b.y > 4; });
  }
  var last = 0;
  function frame(ts) {
    if (ts - last > 70) { last = ts; update(); draw(); }
    requestAnimationFrame(frame);
  }
  for (var w = 0; w < 30; w++) stepFire();
  draw();
  if (!reduced) requestAnimationFrame(frame);

  // ---------- story links over the stumps ----------
  var tales = document.getElementById('tales');
  var note = document.getElementById('note');
  var lastFocus = null;
  TALES.forEach(function (t) {
    var el = document.createElement(t.ready ? 'a' : 'button');
    el.className = 'tale';
    if (t.ready) { el.href = EMIT_URL; if (!local) { el.target = '_blank'; el.rel = 'noopener'; } }
    else el.type = 'button';
    var bx = t.x - 26, by = t.y - 30, bw = 52, bh = 52;
    el.style.left = (bx / W * 100) + '%'; el.style.top = (by / H * 100) + '%';
    el.style.width = (bw / W * 100) + '%'; el.style.height = (bh / H * 100) + '%';
    el.innerHTML = '<span class="name"></span>' + (t.ready ? '' : '<span class="soon">coming soon</span>');
    el.querySelector('.name').textContent = t.name;
    el.addEventListener('mouseenter', function () { hover = t.id; if (reduced) draw(); });
    el.addEventListener('mouseleave', function () { hover = null; if (reduced) draw(); });
    el.addEventListener('focus', function () { hover = t.id; if (reduced) draw(); });
    el.addEventListener('blur', function () { hover = null; if (reduced) draw(); });
    el.addEventListener('click', function (ev) {
      crackle(0.6);
      if (t.ready) {
        if (!local) return; // new tab; the hub stays put
        ev.preventDefault();
        document.getElementById('fade').classList.add('on');
        setTimeout(function () { location.href = EMIT_URL; }, reduced ? 0 : 750);
        return;
      }
      lastFocus = el;
      document.getElementById('note-title').textContent = t.name;
      note.hidden = false;
      document.getElementById('note-close').focus();
    });
    tales.appendChild(el);
  });
  function closeNote() { note.hidden = true; if (lastFocus) lastFocus.focus(); }
  document.getElementById('note-close').addEventListener('click', closeNote);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !note.hidden) closeNote(); });
  window.addEventListener('pageshow', function () { document.getElementById('fade').classList.remove('on'); });

  // ---------- fit to the window ----------
  var stage = document.getElementById('stage');
  function fit() {
    var cs = getComputedStyle(document.body);
    var aw = document.body.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var ah = document.body.clientHeight;
    var s = Math.min(aw / W, ah / H);
    if (s >= 1) s = Math.floor(s);
    stage.style.width = Math.floor(W * s) + 'px';
    stage.style.height = Math.floor(H * s) + 'px';
    stage.style.setProperty('--u', s + 'px');
  }
  window.addEventListener('resize', fit); fit();

  // ---------- sound: a crackling fire, synthesised ----------
  var actx = null, master = null, soundOn = false, crackleTimer = null;
  function startSound() {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      actx = new AC(); master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
      var len = actx.sampleRate * 2, buf = actx.createBuffer(1, len, actx.sampleRate), ch = buf.getChannelData(0), b = 0;
      for (var k = 0; k < len; k++) { b = (b + 0.02 * (Math.random() * 2 - 1)) / 1.02; ch[k] = b * 3.5; }
      var src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
      var lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
      var rg = actx.createGain(); rg.gain.value = 0.35;
      src.connect(lp); lp.connect(rg); rg.connect(master); src.start();
    }
    actx.resume();
    (function loop() { crackle(0.25 + Math.random() * 0.4); crackleTimer = setTimeout(loop, 60 + Math.random() * 380); })();
  }
  function crackle(vol) {
    if (!soundOn || !actx) return;
    var n = Math.floor(actx.sampleRate * 0.02), buf = actx.createBuffer(1, n, actx.sampleRate), ch = buf.getChannelData(0);
    for (var k = 0; k < n; k++) ch[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / n, 4);
    var s = actx.createBufferSource(); s.buffer = buf;
    var hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1200 + Math.random() * 2500;
    var gn = actx.createGain(); gn.gain.value = vol;
    s.connect(hp); hp.connect(gn); gn.connect(master); s.start();
  }
  var sb = document.getElementById('sound');
  sb.addEventListener('click', function () {
    soundOn = !soundOn;
    sb.textContent = soundOn ? 'Sound on' : 'Sound off';
    sb.setAttribute('aria-pressed', String(soundOn));
    if (soundOn) startSound(); else { clearTimeout(crackleTimer); if (actx) actx.suspend(); }
  });
})();
</script>
